name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          pkg-config libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libfreetype6-dev libharfbuzz-dev \
          zlib1g-dev libjpeg-dev libpng-dev

    - name: Install python tools
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Force deep clean (kill all caches)
      run: |
        rm -rf .buildozer bin build
        rm -rf ~/.local/share/python-for-android
        mkdir -p bin

    - name: Build APK
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        CXXFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types"
        PYTHONIOENCODING: "utf-8"
      run: buildozer -v android debug --arch=arm64-v8a 2>&1 | tee build.log

    - name: Check build output dirs (Debug Tree)
      if: always()
      run: |
        echo "===== Root bin/ ====="
        ls -R bin/ 2>/dev/null || echo "No bin/ at root"
        echo "===== All .apk files recursively ====="
        find . -name "*.apk" -print 2>/dev/null || echo "NO APK FOUND ANYWHERE"
        echo "===== .buildozer dists bin/ ====="
        find .buildozer -path "*/bin/*.apk" -print 2>/dev/null || echo "No apk in .buildozer"
        echo "===== Disk usage of .buildozer ====="
        du -sh .buildozer 2>/dev/null || echo "No .buildozer dir"

    - name: Fail if no APK generated
      if: success()
      run: |
        if [ -z "$(find . -name '*.apk' -print -quit 2>/dev/null)" ]; then
          echo "::error::Build finished but NO APK was generated. Check 'Check build output dirs' step."
          exit 1
        fi

    - name: Upload APK (Wildcard fallback multi-path)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: |
          bin/*.apk
          **/*.apk
          .buildozer/**/bin/*.apk
        if-no-files-found: error

    - name: Upload build log (for debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
