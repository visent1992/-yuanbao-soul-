name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libssl-dev libffi-dev
        pip install buildozer==1.5.0 cython==0.29.36
    - name: Clean old build cache
      run: rm -rf .buildozer
    - name: Build APK
      # 仅编译 64 位架构，大幅降低内存占用和耗时（现代手机均支持）
      run: buildozer android debug --arch=arm64-v8a
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: bin/*.apk
