name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          pkg-config libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libfreetype6-dev libharfbuzz-dev \
          zlib1g-dev libjpeg-dev libpng-dev

    - name: Install python tools
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Force deep clean
      run: |
        rm -rf .buildozer bin build
        rm -rf ~/.local/share/python-for-android
        mkdir -p bin

    - name: Build APK
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        CXXFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types"
        PYTHONIOENCODING: "utf-8"
        # 强制隔离 GitHub Runner 自带的 NDK 27，强制使用 buildozer 下载的 r25b
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_HOME: ""
        NDK_ROOT: ""
        # 暴露真实报错
        BUILDOZER_LOG_LEVEL: "2"
      run: |
        echo "--- Start Build ---"
        buildozer -v android debug --arch=arm64-v8a 2>&1 | tee build.log
        echo "--- Build Exit Code: $? ---"

    - name: Check build output
      if: always()
      run: |
        echo "===== Root bin/ ====="
        ls -R bin/ 2>/dev/null || echo "No bin/ at root"
        echo "===== All .apk files ====="
        find . -name "*.apk" -print 2>/dev/null || echo "NO APK FOUND"
        echo "===== .buildozer size ====="
        du -sh .buildozer 2>/dev/null || echo "No .buildozer"

    - name: Fail if no APK
      if: success()
      run: |
        if [ -z "$(find . -name '*.apk' -print -quit 2>/dev/null)" ]; then
          echo "::error::Build finished but NO APK generated."
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: |
          bin/*.apk
          **/*.apk
          .buildozer/**/bin/*.apk
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
