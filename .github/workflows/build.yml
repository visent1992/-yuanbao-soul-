name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          pkg-config libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libfreetype6-dev libharfbuzz-dev \
          zlib1g-dev libjpeg-dev libpng-dev

    - name: Install python tools
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Force deep clean
      run: |
        rm -rf .buildozer bin build
        rm -rf ~/.local/share/python-for-android
        mkdir -p bin

    - name: Debug source dir (定位文件状态)
      run: |
        echo "=== PWD ==="
        pwd
        echo "=== 根目录文件列表 ==="
        ls -la
        echo "=== main.py 确认 ==="
        ls -l main.py
        echo "=== buildozer.spec 确认 ==="
        ls -l buildozer.spec
        echo "=== main.py 头部内容 ==="
        head -5 main.py 2>/dev/null || echo "读取失败"

    - name: Build APK (开启最高日志级别+强制捕获)
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        CXXFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types"
        PYTHONIOENCODING: "utf-8"
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_HOME: ""
        NDK_ROOT: ""
      run: |
        echo "--- Start Build ---"
        # 强制开启 debug 级别日志，不使用 -v 避免被吞
        buildozer --log-level 2 android debug --arch=arm64-v8a 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        echo "--- Build Exit Code: $EXIT_CODE ---"
        if [ $EXIT_CODE -ne 0 ]; then
          echo "===== 崩溃前最后 50 行 ====="
          tail -n 50 build.log
        fi

    - name: Check build output
      if: always()
      run: |
        echo "===== Root bin/ ====="
        ls -R bin/ 2>/dev/null || echo "No bin/ at root"
        echo "===== All .apk files ====="
        find . -name "*.apk" -print 2>/dev/null || echo "NO APK FOUND"

    - name: Fail if no APK
      if: success()
      run: |
        if [ -z "$(find . -name '*.apk' -print -quit 2>/dev/null)" ]; then
          echo "::error::Build finished but NO APK generated."
          exit 1
        fi

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: error
