    - name: Force clean old cache
      run: rm -rf .buildozer bin build

    - name: Build APK
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        CXXFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types"
        PYTHONIOENCODING: "utf-8"
      run: buildozer -v android debug --arch=arm64-v8a 2>&1 | tee build.log

    # 新增：打印目录树，确认 APK 到底生成在哪
    - name: Check build output dirs
      if: always()
      run: |
        echo "--- Root bin/ ---"
        ls -R bin/ 2>/dev/null || echo "No bin/ at root"
        echo "--- .buildozer dists bin/ ---"
        find .buildozer -name "*.apk" -print 2>/dev/null || echo "No apk in .buildozer"
        echo "--- All .apk files ---"
        find . -name "*.apk" -print 2>/dev/null

    - name: Upload APK (Wildcard fallback)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        if-no-files-found: warn

    - name: Upload build log (for debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
