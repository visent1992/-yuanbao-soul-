name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          pkg-config libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libfreetype6-dev libharfbuzz-dev \
          zlib1g-dev libjpeg-dev libpng-dev

    - name: Install python tools
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Force clean old cache
      run: rm -rf .buildozer bin build

    - name: Build APK
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        CXXFLAGS: "-Wno-error=cast-function-type-strict -Wno-error=incompatible-pointer-types"
        PYTHONIOENCODING: "utf-8"
      run: buildozer -v android debug --arch=arm64-v8a 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: bin/*.apk

    - name: Upload build log (for debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
