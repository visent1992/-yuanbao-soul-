name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          pkg-config libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libfreetype6-dev libharfbuzz-dev zlib1g-dev libjpeg-dev libpng-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-v1

    - name: Deep clean
      run: |
        rm -rf .buildozer/bin build
        mkdir -p bin

    - name: Sanity check
      run: |
        echo "PWD: $(pwd)"
        ls -la
        test -f main.py && echo "main.py OK" || echo "main.py MISSING"
        test -f buildozer.spec && echo "spec OK" || echo "spec MISSING"

    - name: Build APK (强制暴露错误+防折叠)
      env:
        MAKEFLAGS: "-j1"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=cast-function-type-strict"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=cast-function-type-strict"
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_HOME: ""
        NDK_ROOT: ""
      run: |
        set -eo pipefail
        echo "::group::Buildozer Full Log"
        buildozer -v android debug --arch=arm64-v8a 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "::endgroup::"
        echo "BUILD_REAL_EXIT=$BUILD_EXIT"
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "===== 崩溃前最后 80 行 ====="
          tail -n 80 build.log
          exit $BUILD_EXIT
        fi
      timeout-minutes: 45

    - name: Check build output
      if: always()
      run: |
        echo "===== Root bin/ ====="
        ls -R bin/ 2>/dev/null || echo "No bin/ at root"
        echo "===== All .apk files ====="
        find . -name "*.apk" -print 2>/dev/null || echo "NO APK FOUND"

    - name: Show crash context
      if: always()
      run: |
        echo "===== grep error ====="
        grep -nE "error:|Traceback|Exception|FileNotFound|No such file|Command failed|exit code" build.log | tail -n 40
        echo "===== tail ====="
        tail -n 60 build.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: bin/*.apk
