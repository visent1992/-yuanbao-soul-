name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk
        pip install buildozer==1.5.0 cython==0.29.36
    - name: Clean old build cache
      run: rm -rf .buildozer
    - name: Build APK
      run: buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuanbao-soul-apk
        path: bin/*.apk
